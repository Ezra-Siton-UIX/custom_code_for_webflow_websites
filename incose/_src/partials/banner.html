<!-- the inner pages' banner (the branding strip they open with), a plain flexbox: the logo, the title box (st-banner-title.svg, cut from
     the home banner's SVG), the line and the dates as text (a page's own date and place: "when" in its first line), the shape -->
<header class="st-banner">
  <div class="st-wrap st-banner-in">
    <img class="st-banner-logo" src="st-images/incose_logo_heb_WHITE.svg" alt="INCOSE IL, האיגוד הישראלי להנדסת מערכות" width="151" height="60" loading="eager" fetchpriority="high">
    <img class="st-banner-title" src="st-images/st-banner-title.svg" alt="הכנס הבינלאומי INCOSE IL 2027" width="380" height="84" loading="eager" fetchpriority="high">
    <div class="st-banner-text">
      <p class="st-banner-line"><strong>שילוב הנדסת מערכות וניהול פרויקטים</strong>מזיהוי הצורך ועד למימוש הערך למשתמש</p>
      <p class="st-banner-when"><time datetime="{{when-iso}}">{{when-date}}</time><span aria-hidden="true">•</span>{{when-place}}</p>
    </div>
    <picture class="st-pic"><source type="image/avif" srcset="st-images/incose_shape.avif"><img class="st-banner-shape" src="st-images/incose_shape.webp" alt="" width="960" height="953" loading="eager" fetchpriority="high"></picture>
  </div>
</header>
