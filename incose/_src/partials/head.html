<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{title-attr}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta property="og:locale" content="he_IL">
<link rel="icon" href="favicon.ico" sizes="any">
<!-- the font is ours (st-fonts), preloaded: there at the first paint, so nothing jumps -->
<link rel="preload" href="st-fonts/google-sans-hebrew.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="st-fonts/google-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<!-- Bootstrap 5 (its RTL build) for the menu; ours after it, so ours wins -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" integrity="sha384-dpuaG1suU0eT09tx5plTaGMLBsfDLzUCCUXOY2j/LSvXYuG6Bqs43ALlhIqAJVRb" crossorigin="anonymous">
<link rel="stylesheet" href="st-css/st.css">
<!-- the first screen's pictures drawn by CSS (the dark sections' corner dots), fetched at once like an eager <img>: a CSS background is found only after the CSS is read. A page adds its own in its first line ("preload") -->
<link rel="preload" as="image" href="st-images/ai_dots_tl.avif" type="image/avif">
<link rel="preload" as="image" href="st-images/ai_dots_br.avif" type="image/avif">
<!-- @preload -->
</head>
<body data-bs-no-jquery>
